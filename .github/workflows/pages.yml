name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full commit SHA approved for release
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify and package static site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require main and the approved commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "::error::Dispatch this workflow from the main branch."
            exit 1
          fi
          if [ -z "$APPROVED_SHA" ] || [ "$APPROVED_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The approved SHA must exactly match this workflow run's commit SHA."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
      - name: Run model checks
        run: npm test
      - name: Run browser checks
        run: npm run test:browser
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/

  deploy:
    name: Publish static site
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
